[pytest]
testpaths = tests
pythonpath = .
# Run in parallel with: pytest -n auto  (each xdist worker gets its own live server + database)
addopts = -ra --strict-markers
markers =
    smoke: fast checks that the critical paths work
    regression: full regression suite
    ui: browser tests (Selenium)
    api: REST API tests
    db: tests that validate data in the database with SQL
