<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Support chat</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; font-size: 14px; }
    #messages { height: 200px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px; }
    .msg { margin: 4px 0; }
    .bot { color: #4338ca; }
    form { display: flex; gap: 6px; margin-top: 8px; }
    input { flex: 1; padding: 6px; border: 1px solid #cbd5e1; border-radius: 6px; }
    button { padding: 6px 12px; background: #4f46e5; color: #fff; border: 0; border-radius: 6px; }
  </style>
</head>
<body>
  <div id="messages"><div class="msg bot">Hi! How can we help today?</div></div>
  <form id="chat-form">
    <input id="chat-input" placeholder="Type a message" autocomplete="off">
    <button id="chat-send" type="submit">Send</button>
  </form>
  <script>
    const box = document.getElementById("messages");
    function add(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      box.appendChild(div);
    }
    document.getElementById("chat-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const input = document.getElementById("chat-input");
      if (!input.value.trim()) return;
      add(input.value, "user");
      const lower = input.value.toLowerCase();
      input.value = "";
      setTimeout(() => add(lower.includes("refund")
        ? "Refunds are processed within 5 business days."
        : "Thanks! An agent will reply shortly.", "bot"), 600);
    });
  </script>
</body>
</html>
